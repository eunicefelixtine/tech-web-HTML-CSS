{% extends "base.html" %}

{% block titre %}Réserver - Chez Ngono{% endblock %}

{% block contenu %}
<section>
    <h1>Réserver une table</h1>

    <form id="form-reservation" method="post" action="{{ url_for('reserver') }}">
        <label for="nom">Nom</label>
        <input id="nom" name="nom" value="{{ donnees.get('nom', '') }}" required>

        <label for="telephone">Téléphone</label>
        <input id="telephone" name="telephone" type="tel"
               value="{{ donnees.get('telephone', '') }}" required>

        <label for="date">Date</label>
        <input id="date" name="date" type="date"
               min="{{ date_min }}"
               value="{{ donnees.get('date', '') }}" required>

        <label for="service">Service</label>
        <select id="service" name="service" required>
            <option value="midi"
                {% if donnees.get('service', 'midi') == 'midi' %}selected{% endif %}>
                Midi
            </option>
            <option value="soir"
                {% if donnees.get('service') == 'soir' %}selected{% endif %}>
                Soir
            </option>
        </select>

        <label for="personnes">Nombre de personnes</label>
        <input id="personnes" name="personnes" type="number"
               min="1" max="20"
               value="{{ donnees.get('personnes', 2) }}" required>
        <p id="erreur" class="message erreur" aria-live="polite"></p>
        <button type="submit">Réserver</button>
    </form>
</section>
{% endblock %}

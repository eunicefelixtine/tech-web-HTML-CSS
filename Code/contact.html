<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact et réservation au restaurant Chez Ngono.">
    <title>Contact et réservation - Chez Ngono</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

<header>
    <p class="logo">Chez Ngono</p>

    <button id="bouton-menu" aria-label="Ouvrir le menu">&#9776;</button>

    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="contact.html">Contact et réservation</a></li>
        </ul>
    </nav>
</header>

<main>

    <h1>Contact et réservation</h1>

    <form id="form-reservation">

        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>

        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" name="telephone" required>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <label for="personnes">Nombre de personnes</label>
        <input
            type="number"
            id="personnes"
            name="personnes"
            min="1"
            max="20"
            required
        >

        <label for="service">Service</label>
        <select id="service" name="service" required>
            <option value="midi">Midi</option>
            <option value="soir">Soir</option>
        </select>

        <label for="remarques">Remarques</label>
        <textarea id="remarques" name="remarques" rows="5"></textarea>

        <button type="submit">Réserver</button>

    </form>

    <p id="erreur"></p>

</main>

<footer>
    <p>Chez Ngono, rue Joss, Akwa, Douala</p>

    <p>
        <a href="tel:+237690000000">690 00 00 00</a>
        ·
        <a href="mailto:contact@chezngono.cm">
            contact@chezngono.cm
        </a>
    </p>
</footer>

</body>
</html>
